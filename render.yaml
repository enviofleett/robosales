services:
  - type: web
    name: harvey-cloud
    env: python
    buildCommand: "pip install -e . httpx supabase duckduckgo_search maigret sherlock-project uvicorn"
    startCommand: "uvicorn server.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: "meta-llama/llama-3.3-70b-instruct"
